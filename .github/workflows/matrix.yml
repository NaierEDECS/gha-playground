name: Matrix

on: workflow_dispatch

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.node }}" = "18" ] && [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "node 18 on windows: failing on purpose"; exit 1
          fi
          sleep 30
          echo "node ${{ matrix.node }} on ${{ matrix.os }}: passed"
