name: Hello

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'src/app.txt'
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Make a "build"
        run: |
          mkdir build
          echo "built at $(date)" > build/output.txt
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: my-build
          path: build/

  goodbye:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: my-build
      - name: Look around
        run: |
          ls -la
          cat output.txt
