name: Hello

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'src/app.txt'
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Say hi
        run: echo "Hello, GitHub Actions"
      - name: Look around
        run: |
          pwd
          ls -la
  goodbye:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Look around
        run: ls -la
