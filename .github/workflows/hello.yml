name: Hello

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'src/app.txt'
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make_tag.outputs.tag }}
    steps:
      - name: Make a tag
        id: make_tag
        run: echo "tag=v-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  goodbye:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying image myapp:${{ needs.hello.outputs.tag }}"
