name: Hello

on: push

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Say hi
        run: echo "Hello, GitHub Actions"
      - name: Look around
        run: |
          pwd
          ls -la
  goodbye:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Look around
        run: ls -la
