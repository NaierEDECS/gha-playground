name: Reusable deploy

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Deploying to ${{ inputs.target }} — password length ${#DB_PASSWORD}"
      - name: Can the reusable workflow see README.md?
        run: ls README.md && echo "FOUND" || echo "NOT FOUND"
