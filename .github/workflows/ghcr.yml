name: GHCR

on: workflow_dispatch

jobs:
  push-read-only:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Build and push
        run: |
          echo 'FROM alpine:3.20' > Dockerfile
          docker build -t ghcr.io/naieredecs/gha-playground:demo .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/naieredecs/gha-playground:demo

  push-write:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Build and push
        run: |
          echo 'FROM alpine:3.20' > Dockerfile
          docker build -t ghcr.io/naieredecs/gha-playground:demo .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/naieredecs/gha-playground:demo
