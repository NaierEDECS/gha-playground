name: Deploy

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Which password?
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "build sees length ${#DB_PASSWORD}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Which password?
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "deploy sees length ${#DB_PASSWORD}"
