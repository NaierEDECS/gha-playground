name: Secrets

on: workflow_dispatch

env:
  DB_NAME: chatapp

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Use them
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "DB name: $DB_NAME"
          echo "Password: $DB_PASSWORD"
          echo "Password length: ${#DB_PASSWORD}"
