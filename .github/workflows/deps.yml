name: Deps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - '.github/workflows/deps.yml'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-${{ hashFiles('package-lock.json') }}
      - name: Install
        run: npm ci
