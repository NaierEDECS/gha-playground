name: Greet
description: Say hello to someone
inputs:
  who:
    description: Who to greet
    required: true
runs:
  using: composite
  steps:
    - run: echo "Hello, ${{ inputs.who }}!"
      shell: bash
    - run: echo "Today is $(date +%A)"
      shell: bash
    - name: Can the composite action see README.md?
      run: ls README.md && echo "FOUND" || echo "NOT FOUND"
      shell: bash
